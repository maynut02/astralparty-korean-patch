name: Patch and Build

on:
  workflow_dispatch:
    inputs:
      route:
        description: "Optional route (e.g. INT_STEAM). Leave empty to process all routes from rules/snapshot."
        required: false
        default: ""
      release_channel:
        description: "Release channel"
        required: true
        type: choice
        default: "official"
        options:
          - "official"
          - "pre"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.repository }}-release-pipeline
  cancel-in-progress: false

jobs:
  patch:
    name: Patch
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code (main branch)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Checkout data branch (workflow)
        uses: actions/checkout@v5
        with:
          ref: workflow
          path: workflow-data
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore output_get/state from workflow branch
        run: |
          set -euo pipefail
          rm -rf output_get state
          mkdir -p output_get state
          rsync -a workflow-data/output_get/ output_get/
          rsync -a workflow-data/state/ state/

      - name: Run assets-patch
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.route }}" ]; then
            astral-patch patch --route "${{ inputs.route }}"
          else
            astral-patch patch
          fi

      - name: Commit updated output_get data to workflow branch
        run: |
          set -euo pipefail
          cd workflow-data
          rsync -a ../output_get/ output_get/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output_get/
          if ! git diff --cached --quiet; then
            git commit -m "chore(workflow): update output_get data and patches.json"
            git push origin workflow
          fi

      - name: Upload patched data artifact
        uses: actions/upload-artifact@v6
        with:
          name: patched-output
          path: |
            output_patch/
            state/get_report.json
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build and Upload
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [patch]

    steps:
      - name: Checkout code (main branch)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Download patched data artifact
        uses: actions/download-artifact@v5
        with:
          name: patched-output
          path: _incoming/patched

      - name: Restore output_patch/state
        run: |
          set -euo pipefail
          rm -rf output_patch state
          mkdir -p output_patch state
          rsync -a _incoming/patched/output_patch/ output_patch/
          cp _incoming/patched/state/get_report.json state/get_report.json

      - name: Build release zip files
        run: |
          set -euo pipefail
          ZIP_ARGS=(
            --snapshot-file state/get_report.json
            --output-root output_patch
            --zip-dir release_zips
          )

          if [ -n "${{ inputs.route }}" ]; then
            ZIP_ARGS+=(--route "${{ inputs.route }}")
          fi

          if [ "${{ inputs.release_channel }}" = "pre" ]; then
            ZIP_ARGS+=(--file-suffix=-pre)
          fi

          astral-workflow build-patch-zips "${ZIP_ARGS[@]}"

      - name: Prepare release metadata
        id: release_meta
        run: |
          set -euo pipefail
          META_ARGS=(
            --snapshot-file state/get_report.json
          )

          if [ -n "${{ inputs.route }}" ]; then
            META_ARGS+=(--route "${{ inputs.route }}")
          fi

          if [ "${{ inputs.release_channel }}" = "pre" ]; then
            META_ARGS+=(--tag-suffix=-pre)
          fi

          astral-workflow build-release-meta "${META_ARGS[@]}" --github-output "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release_meta.outputs.tag }}"
          TITLE="${{ steps.release_meta.outputs.title }}"
          NOTES_FILE="release_notes.txt"

          cat > "${NOTES_FILE}" <<'EOF'
          ${{ steps.release_meta.outputs.body }}
          EOF

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release_zips/*.zip --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}" --target main
          else
            gh release create "${TAG}" release_zips/*.zip --title "${TITLE}" --notes-file "${NOTES_FILE}" --target main
          fi

          RELEASE_ID="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.id')"
          gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" -F prerelease=false -F draft=false >/dev/null

          if [ "${{ inputs.release_channel }}" = "official" ]; then
            PRE_TAG="${TAG}-pre"
            if gh release view "${PRE_TAG}" >/dev/null 2>&1; then
              gh release delete "${PRE_TAG}" --yes
            fi
          fi

      - name: Notify Discord
        if: ${{ success() }}
        uses: ./.github/actions/notify-discord-release
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          tag: ${{ steps.release_meta.outputs.tag }}
          routes_summary: ${{ steps.release_meta.outputs.routes_summary }}

      - name: Delete run artifacts
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          astral-workflow delete-run-artifacts \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"
